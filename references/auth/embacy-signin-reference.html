<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Embacy — Sign In</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue: #3a7bfd;
      --blue-glow: rgba(58,123,253,0.45);
      --glass-bg: rgba(255,255,255,0.06);
      --glass-border: rgba(255,255,255,0.12);
      --text: #f0f0f0;
      --muted: rgba(255,255,255,0.4);
    }

    html, body {
      width: 100%; height: 100%;
      background: #000;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }

    /* ── STARFIELD ── */
    canvas#stars {
      position: fixed; inset: 0; z-index: 0;
      pointer-events: none;
    }

    /* ── SCENE ── */
    .scene {
      position: fixed; inset: 0; z-index: 1;
      display: flex; align-items: center; justify-content: center;
    }

    /* ── FLOOR LINE ── */
    .floor {
      position: absolute;
      bottom: 22%;
      left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(58,123,253,0.3) 30%, rgba(58,123,253,0.6) 50%, rgba(58,123,253,0.3) 70%, transparent);
      z-index: 2;
    }

    /* ══════════════════════════════
       GIRL CHARACTER (pure CSS)
    ══════════════════════════════ */
    .girl-wrap {
      position: absolute;
      bottom: 22%;
      left: -220px;
      width: 140px;
      z-index: 10;
      /* walking animation → stops → bag-drop → stays */
      animation: girlWalk 1.8s cubic-bezier(.4,0,.2,1) 0.4s forwards;
    }

    @keyframes girlWalk {
      0%   { left: -220px; }
      80%  { left: calc(50% - 340px); }
      90%  { left: calc(50% - 340px); transform: translateY(-8px); }
      100% { left: calc(50% - 340px); transform: translateY(0); }
    }

    /* ── SVG character ── */
    .girl-svg { width: 140px; display: block; }

    /* leg walk cycle */
    .leg-l { transform-origin: 50px 68px; animation: legL 0.36s ease-in-out infinite alternate; }
    .leg-r { transform-origin: 60px 68px; animation: legR 0.36s ease-in-out infinite alternate; }
    .arm-l { transform-origin: 38px 42px; animation: armL 0.36s ease-in-out infinite alternate; }
    .arm-r { transform-origin: 72px 42px; animation: armR 0.36s ease-in-out infinite alternate; }

    @keyframes legL  { from{ transform:rotate(-18deg) } to{ transform:rotate(22deg) } }
    @keyframes legR  { from{ transform:rotate(22deg) } to{ transform:rotate(-18deg) } }
    @keyframes armL  { from{ transform:rotate(15deg) } to{ transform:rotate(-20deg) } }
    @keyframes armR  { from{ transform:rotate(-20deg) } to{ transform:rotate(15deg) } }

    /* stop walking after arrival */
    .girl-wrap.arrived .leg-l,
    .girl-wrap.arrived .leg-r,
    .girl-wrap.arrived .arm-l,
    .girl-wrap.arrived .arm-r {
      animation: none;
      transform: rotate(0deg);
    }

    /* bag drop bounce */
    .bag {
      position: absolute;
      bottom: -22px;
      right: -10px;
      width: 48px;
      opacity: 0;
      transform: translateY(-30px);
      transition: transform 0.5s cubic-bezier(.34,1.56,.64,1), opacity 0.3s;
    }
    .bag.dropped { opacity: 1; transform: translateY(0); }

    /* ══════════════════════════════
       FLOATING GLASS CARD (back)
    ══════════════════════════════ */
    .card-3d {
      position: absolute;
      bottom: 22%;
      left: calc(50% - 200px);
      width: 340px;
      height: 220px;
      border-radius: 24px;
      background: rgba(10,10,30,0.55);
      border: 1px solid rgba(58,123,253,0.25);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 0 60px rgba(58,123,253,0.15), inset 0 1px 0 rgba(255,255,255,0.08);
      transform: perspective(900px) rotateY(-14deg) rotateX(8deg) translateY(0);
      opacity: 0;
      transition: opacity 0.8s, transform 0.8s;
      z-index: 5;
      overflow: hidden;
    }
    .card-3d.visible { opacity: 1; transform: perspective(900px) rotateY(-14deg) rotateX(8deg) translateY(-50px); }
    .card-3d::before {
      content: '';
      position: absolute; top: -40%; left: -20%;
      width: 80px; height: 220%;
      background: rgba(255,255,255,0.04);
      transform: rotate(20deg);
    }
    .card-label {
      position: absolute; top: 18px; left: 20px;
      font-size: 11px; letter-spacing: 0.12em; color: var(--muted);
      text-transform: uppercase;
    }
    .card-logo {
      position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
      font-size: 13px; font-weight: 600; color: var(--text); letter-spacing: 0.05em;
    }
    .card-glow {
      position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%);
      width: 120px; height: 120px;
      background: radial-gradient(circle, rgba(58,123,253,0.7) 0%, transparent 70%);
      border-radius: 50%;
      filter: blur(18px);
    }

    /* ══════════════════════════════
       LOGIN FORM PANEL
    ══════════════════════════════ */
    .login-panel {
      position: relative; z-index: 20;
      width: 380px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      padding: 44px 40px 40px;
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.04),
        0 8px 60px rgba(0,0,0,0.6),
        0 0 80px rgba(58,123,253,0.08);

      opacity: 0;
      transform: translateY(40px) scale(0.96);
      transition: opacity 0.7s cubic-bezier(.4,0,.2,1), transform 0.7s cubic-bezier(.4,0,.2,1);
      pointer-events: none;
    }
    .login-panel.visible {
      opacity: 1; transform: translateY(0) scale(1);
      pointer-events: all;
    }

    /* inner shimmer line */
    .login-panel::before {
      content: '';
      position: absolute; top: 0; left: 20%; right: 20%; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent);
      border-radius: 50%;
    }

    .brand {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 32px;
    }
    .brand-icon {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, var(--blue) 0%, #1a4db3 100%);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 16px rgba(58,123,253,0.4);
    }
    .brand-icon svg { width: 20px; height: 20px; fill: #fff; }
    .brand-name { font-size: 16px; font-weight: 600; color: var(--text); letter-spacing: 0.02em; }
    .brand-tag {
      margin-left: auto;
      font-size: 10px; color: var(--blue);
      border: 1px solid rgba(58,123,253,0.4);
      border-radius: 20px; padding: 2px 8px;
      letter-spacing: 0.08em;
    }

    h2 {
      font-size: 22px; font-weight: 700; color: var(--text);
      margin-bottom: 6px;
    }
    .sub {
      font-size: 13px; color: var(--muted); margin-bottom: 28px;
    }

    .field {
      margin-bottom: 18px;
    }
    .field label {
      display: block; font-size: 11px; font-weight: 500;
      color: var(--muted); letter-spacing: 0.08em;
      text-transform: uppercase; margin-bottom: 8px;
    }
    .input-wrap {
      position: relative;
    }
    .input-wrap svg {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      width: 16px; height: 16px; opacity: 0.45; pointer-events: none;
    }
    .input-wrap input {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 13px 14px 13px 42px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
    }
    .input-wrap input::placeholder { color: rgba(255,255,255,0.22); }
    .input-wrap input:focus {
      border-color: var(--blue);
      background: rgba(58,123,253,0.07);
      box-shadow: 0 0 0 3px rgba(58,123,253,0.15);
    }

    .toggle-pass {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; padding: 4px;
      color: var(--muted);
    }
    .toggle-pass:hover { color: var(--text); }
    .toggle-pass svg { width: 16px; height: 16px; display: block; fill: currentColor; }

    .options {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 26px;
    }
    .remember {
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; color: var(--muted); cursor: pointer;
      user-select: none;
    }
    .remember input { display: none; }
    .checkmark {
      width: 16px; height: 16px; border-radius: 5px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.04);
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s, border-color 0.2s;
    }
    .remember input:checked ~ .checkmark {
      background: var(--blue); border-color: var(--blue);
    }
    .checkmark svg { width: 10px; height: 10px; fill: #fff; opacity: 0; transition: opacity 0.2s; }
    .remember input:checked ~ .checkmark svg { opacity: 1; }

    .forgot { font-size: 12px; color: var(--blue); text-decoration: none; }
    .forgot:hover { text-decoration: underline; }

    .btn-login {
      width: 100%;
      padding: 14px;
      border: none; border-radius: 14px; cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-size: 14px; font-weight: 600; letter-spacing: 0.04em;
      color: #fff;
      background: linear-gradient(135deg, #3a7bfd 0%, #1a4db3 100%);
      box-shadow: 0 4px 24px rgba(58,123,253,0.4);
      transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
      position: relative; overflow: hidden;
    }
    .btn-login::after {
      content: '';
      position: absolute; top: 0; left: -100%; width: 60%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
      transform: skewX(-20deg);
      transition: left 0.5s;
    }
    .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(58,123,253,0.55); filter: brightness(1.1); }
    .btn-login:hover::after { left: 150%; }
    .btn-login:active { transform: translateY(0); }

    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 22px 0; color: rgba(255,255,255,0.15); font-size: 12px;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px;
      background: rgba(255,255,255,0.1);
    }

    .socials {
      display: flex; gap: 10px;
    }
    .btn-social {
      flex: 1; padding: 11px; border-radius: 12px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.09);
      color: var(--muted); font-size: 12px; font-family: 'Inter', sans-serif;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 7px;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }
    .btn-social:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2); color: var(--text); }
    .btn-social svg { width: 16px; height: 16px; }

    .signup {
      text-align: center; margin-top: 22px;
      font-size: 12px; color: var(--muted);
    }
    .signup a { color: var(--blue); text-decoration: none; }
    .signup a:hover { text-decoration: underline; }

    /* field stagger */
    .login-panel.visible .field:nth-child(1) { animation: fadeUp 0.5s 0.2s both; }
    .login-panel.visible .field:nth-child(2) { animation: fadeUp 0.5s 0.32s both; }
    .login-panel.visible .options           { animation: fadeUp 0.5s 0.44s both; }
    .login-panel.visible .btn-login         { animation: fadeUp 0.5s 0.52s both; }
    .login-panel.visible .divider           { animation: fadeUp 0.5s 0.6s both; }
    .login-panel.visible .socials           { animation: fadeUp 0.5s 0.68s both; }
    .login-panel.visible .signup            { animation: fadeUp 0.5s 0.76s both; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── ambient orbs ── */
    .orb {
      position: fixed; border-radius: 50%;
      filter: blur(80px); pointer-events: none; z-index: 0;
    }
    .orb-1 { width: 400px; height: 400px; background: rgba(58,123,253,0.12); top: -100px; right: 10%; }
    .orb-2 { width: 300px; height: 300px; background: rgba(80,30,180,0.1); bottom: 5%; left: 5%; }
    .orb-3 { width: 200px; height: 200px; background: rgba(0,200,255,0.07); top: 40%; left: 35%; }
  </style>
</head>
<body>

<canvas id="stars"></canvas>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<div class="scene">
  <div class="floor"></div>

  <!-- Floating back card -->
  <div class="card-3d" id="card3d">
    <div class="card-label">embacy.coin</div>
    <div class="card-logo">embacy</div>
    <div class="card-glow"></div>
  </div>

  <!-- Girl character -->
  <div class="girl-wrap" id="girlWrap">
    <svg class="girl-svg" viewBox="0 0 120 160" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- shadow -->
      <ellipse cx="60" cy="155" rx="28" ry="5" fill="rgba(58,123,253,0.18)"/>
      <!-- legs -->
      <g class="leg-l">
        <rect x="44" y="98" width="14" height="46" rx="7" fill="#1a1a2e"/>
        <rect x="40" y="138" width="20" height="10" rx="5" fill="#111"/>
      </g>
      <g class="leg-r">
        <rect x="62" y="98" width="14" height="46" rx="7" fill="#1a1a2e"/>
        <rect x="60" y="138" width="20" height="10" rx="5" fill="#111"/>
      </g>
      <!-- body / jacket -->
      <rect x="30" y="58" width="60" height="46" rx="14" fill="#0d1b3e"/>
      <!-- lapels -->
      <path d="M50 58 L60 74 L70 58" fill="#0a1428" stroke="rgba(58,123,253,0.3)" stroke-width="0.5"/>
      <!-- shirt -->
      <rect x="53" y="58" width="14" height="30" rx="4" fill="#e8e8f0"/>
      <!-- neck -->
      <rect x="53" y="48" width="14" height="14" rx="7" fill="#f0c8a0"/>
      <!-- head -->
      <ellipse cx="60" cy="34" rx="18" ry="20" fill="#f0c8a0"/>
      <!-- hair -->
      <path d="M42 28 Q44 10 60 12 Q76 10 78 28 Q76 18 60 18 Q44 18 42 28Z" fill="#1a0a00"/>
      <path d="M42 28 Q38 38 40 48 Q42 38 44 36Z" fill="#1a0a00"/>
      <path d="M78 28 Q80 42 76 50 Q76 36 74 32Z" fill="#1a0a00"/>
      <!-- bun -->
      <ellipse cx="60" cy="14" rx="10" ry="7" fill="#1a0a00"/>
      <!-- eyes -->
      <ellipse cx="54" cy="32" rx="2.5" ry="3" fill="#1a1a2e"/>
      <ellipse cx="66" cy="32" rx="2.5" ry="3" fill="#1a1a2e"/>
      <ellipse cx="55" cy="31" rx="0.8" ry="0.8" fill="#fff"/>
      <ellipse cx="67" cy="31" rx="0.8" ry="0.8" fill="#fff"/>
      <!-- lashes -->
      <path d="M51.5 29 Q52 27.5 53 28" stroke="#1a1a2e" stroke-width="0.8" fill="none"/>
      <path d="M63.5 29 Q64 27.5 65 28" stroke="#1a1a2e" stroke-width="0.8" fill="none"/>
      <!-- lips -->
      <path d="M55 40 Q60 44 65 40" stroke="#d4806a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <!-- arms -->
      <g class="arm-l">
        <rect x="16" y="62" width="16" height="36" rx="8" fill="#0d1b3e"/>
        <!-- hand holding bag strap -->
        <ellipse cx="24" cy="100" rx="8" ry="7" fill="#f0c8a0"/>
      </g>
      <g class="arm-r">
        <rect x="88" y="62" width="16" height="38" rx="8" fill="#0d1b3e"/>
        <ellipse cx="96" cy="102" rx="8" ry="7" fill="#f0c8a0"/>
      </g>
    </svg>

    <!-- Handbag (initially held, then dropped) -->
    <div class="bag" id="bag">
      <svg viewBox="0 0 48 42" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- strap -->
        <path d="M14 10 Q24 2 34 10" stroke="#3a7bfd" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <!-- bag body -->
        <rect x="4" y="10" width="40" height="28" rx="8" fill="#1a2a5e"/>
        <rect x="4" y="10" width="40" height="28" rx="8" fill="none" stroke="rgba(58,123,253,0.6)" stroke-width="1"/>
        <!-- clasp -->
        <rect x="19" y="20" width="10" height="8" rx="3" fill="#3a7bfd"/>
        <circle cx="24" cy="24" r="2" fill="#fff" opacity="0.6"/>
        <!-- shine -->
        <path d="M8 14 Q14 12 20 14" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      </svg>
    </div>
  </div>

  <!-- LOGIN PANEL -->
  <div class="login-panel" id="loginPanel">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 20 20"><path d="M10 2L3 7v6l7 5 7-5V7L10 2zm0 2.5l5 3.5v4.5L10 15 5 12.5V8l5-3.5z"/></svg>
      </div>
      <span class="brand-name">embacy</span>
      <span class="brand-tag">COIN</span>
    </div>

    <h2>Welcome back</h2>
    <p class="sub">Sign in to your account to continue</p>

    <div class="field">
      <label>Username</label>
      <div class="input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
        <input type="text" placeholder="Enter your username" autocomplete="username"/>
      </div>
    </div>

    <div class="field">
      <label>Password</label>
      <div class="input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
        <input type="password" id="passInput" placeholder="Enter your password" autocomplete="current-password"/>
        <button class="toggle-pass" id="togglePass" type="button" aria-label="Toggle password">
          <svg id="eyeIcon" viewBox="0 0 24 24"><path d="M1 12C3 6 7 3 12 3s9 3 11 9c-2 6-6 9-11 9S3 18 1 12z"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        </button>
      </div>
    </div>

    <div class="options">
      <label class="remember">
        <input type="checkbox"/>
        <span class="checkmark">
          <svg viewBox="0 0 10 10"><polyline points="1.5,5 4,7.5 8.5,2.5" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        Remember me
      </label>
      <a href="#" class="forgot">Forgot password?</a>
    </div>

    <button class="btn-login" id="loginBtn">Sign In</button>

    <div class="divider">or continue with</div>

    <div class="socials">
      <button class="btn-social">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Google
      </button>
      <button class="btn-social">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        Twitter
      </button>
      <button class="btn-social">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 00-4.885-1.515.074.074 0 00-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 00-5.487 0 12.64 12.64 0 00-.617-1.25.077.077 0 00-.079-.037A19.736 19.736 0 003.677 4.37a.07.07 0 00-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 00.031.057 19.9 19.9 0 005.993 3.03.078.078 0 00.084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 00-.041-.106 13.107 13.107 0 01-1.872-.892.077.077 0 01-.008-.128 10.2 10.2 0 00.372-.292.074.074 0 01.077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 01.078.01c.12.098.246.198.373.292a.077.077 0 01-.006.127 12.299 12.299 0 01-1.873.892.077.077 0 00-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 00.084.028 19.839 19.839 0 006.002-3.03.077.077 0 00.032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 00-.031-.03z"/></svg>
        Discord
      </button>
    </div>

    <p class="signup">Don't have an account? <a href="#">Create one</a></p>
  </div>
</div>

<script>
  /* ── STARS ── */
  const canvas = document.getElementById('stars');
  const ctx = canvas.getContext('2d');
  let stars = [];

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    initStars();
  }

  function initStars() {
    stars = Array.from({ length: 160 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.2 + 0.2,
      a: Math.random(),
      da: (Math.random() - 0.5) * 0.006,
    }));
  }

  function animStars() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const s of stars) {
      s.a = Math.max(0.05, Math.min(1, s.a + s.da));
      if (s.a <= 0.05 || s.a >= 1) s.da *= -1;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${s.a * 0.7})`;
      ctx.fill();
    }
    requestAnimationFrame(animStars);
  }

  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();
  animStars();

  /* ── ANIMATION SEQUENCE ── */
  const girlWrap  = document.getElementById('girlWrap');
  const bag       = document.getElementById('bag');
  const loginPanel = document.getElementById('loginPanel');
  const card3d    = document.getElementById('card3d');

  // 1. Walk ends (1.8s + 0.4s delay = 2.2s)
  setTimeout(() => {
    girlWrap.classList.add('arrived');

    // 2. Drop bag
    setTimeout(() => {
      bag.classList.add('dropped');

      // 3. Card floats up
      setTimeout(() => {
        card3d.classList.add('visible');

        // 4. Login panel appears
        setTimeout(() => {
          loginPanel.classList.add('visible');
        }, 400);

      }, 300);
    }, 300);
  }, 2200);

  /* ── TOGGLE PASSWORD ── */
  const togglePass = document.getElementById('togglePass');
  const passInput  = document.getElementById('passInput');
  let passVisible  = false;

  togglePass.addEventListener('click', () => {
    passVisible = !passVisible;
    passInput.type = passVisible ? 'text' : 'password';
    togglePass.querySelector('svg').style.opacity = passVisible ? '1' : '0.45';
  });

  /* ── LOGIN BUTTON ── */
  const loginBtn = document.getElementById('loginBtn');
  loginBtn.addEventListener('click', () => {
    loginBtn.textContent = '✓ Signed In';
    loginBtn.style.background = 'linear-gradient(135deg,#2ecc71,#1a8a4a)';
    loginBtn.style.boxShadow = '0 4px 24px rgba(46,204,113,0.4)';
    setTimeout(() => {
      loginBtn.textContent = 'Sign In';
      loginBtn.style.background = '';
      loginBtn.style.boxShadow = '';
    }, 2000);
  });

  /* ── CARD 3D MOUSE PARALLAX ── */
  document.addEventListener('mousemove', (e) => {
    if (!card3d.classList.contains('visible')) return;
    const mx = (e.clientX / window.innerWidth  - 0.5) * 10;
    const my = (e.clientY / window.innerHeight - 0.5) * 6;
    card3d.style.transform = `perspective(900px) rotateY(${-14 + mx}deg) rotateX(${8 - my}deg) translateY(-50px)`;
  });
</script>
</body>
</html>
